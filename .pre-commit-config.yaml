# Hooks pre-commit (E00US002) — qualité bloquante avant chaque commit.
# cf. guide-architecture.md §5. Installation : `pre-commit install` (depuis la racine).
#
# - Backend : ruff (lint+format) et mypy strict tournent dans des environnements
#   auto-gérés par pre-commit (dépendances épinglées ci-dessous, self-contained).
# - Frontend : eslint et prettier utilisent les node_modules du projet (npx --no-install) ;
#   exécuter `npm install` dans frontend/ au préalable.
default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint) — backend
        entry: ruff check --fix
        language: python
        additional_dependencies: ["ruff==0.8.6"]
        types_or: [python, pyi]
        files: ^backend/

      - id: ruff-format
        name: ruff (format) — backend
        entry: ruff format
        language: python
        additional_dependencies: ["ruff==0.8.6"]
        types_or: [python, pyi]
        files: ^backend/

      - id: mypy
        name: mypy (strict) — backend
        entry: mypy --strict --config-file=backend/pyproject.toml backend
        language: python
        additional_dependencies:
          - "mypy==1.14.1"
          - "fastapi==0.139.0"
          - "uvicorn==0.51.0"
          - "httpx==0.28.1"
          - "pytest==9.1.1"
          - "sqlalchemy==2.0.51"
          - "alembic==1.18.5"
          - "zeroconf==0.150.0"
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: domain-isolation
        name: garde-fou imports domaine (hexagonal) — backend
        entry: pytest backend/tests/test_domain_isolation.py -q
        language: python
        additional_dependencies: ["pytest==9.1.1"]
        pass_filenames: false
        # `tests/conftest` est dans la liste : ce hook s'exécute avec **pytest pour seule
        # dépendance**, et pytest charge le conftest avant tout test. Un import de framework
        # ajouté là casserait le garde-fou sans que la CI (environnement complet) ne le voie.
        files: ^backend/(domain/.*|tests/(test_domain_isolation|conftest))\.py$

      - id: atlas-a-jour
        name: atlas — cartes générées à jour
        entry: bash -c 'cd backend && python -m atlas --verifier'
        # `language: system` et non `python` : le générateur est en **stdlib pure**, il n'a besoin
        # d'aucun environnement dédié (ADR-0086). Même patron que les hooks eslint / prettier.
        language: system
        pass_filenames: false
        # Le hook **vérifie, il ne régénère pas** : un hook qui réécrit des fichiers pendant le
        # commit laisse un état `staged` / `unstaged` incohérent et surprend. Il échoue en donnant
        # la commande à lancer.
        # Les quatre livrables de suivi entrent dans ce motif depuis E00US019 : l'atlas recalcule
        # leurs compteurs et confronte leurs renvois. Sans eux, corriger une ligne de `SUIVI-US.md`
        # périmait les cartes sans que rien ne le dise ici — et la CI le découvrait après le push.
        #
        # ⚠️ **Le code source entre dans le motif depuis E00US020**, et c'est un renversement
        # d'arbitrage assumé. Jusque-là, le code ne périmait les cartes que **rarement** (renommer
        # une classe citée par un ADR), et la note d'origine tranchait : « laisser la CI être
        # l'autorité sur ce cas », plutôt qu'imposer quelques secondes à presque chaque commit.
        # La carte du code renverse le rapport : elle compte **tous** les imports du backend et
        # tous ceux entre features du front, donc désormais presque **chaque US** périme les
        # cartes. Garder l'ancien arbitrage ferait rougir la CI sur presque **toutes** les PR,
        # avec un correctif d'une ligne à chaque fois — c'est précisément le mécanisme qui fait
        # désactiver une porte. Le coût constaté est de ~5 s sur les commits concernés.
        #
        # Le motif épouse **exactement la surface lue** : les cinq couches plus `atlas/` côté
        # backend, `features/` côté front. Un `backend/.*\.py` large aurait fait payer ces
        # secondes aux commits purement de tests ou de migrations, que la carte ne lit jamais —
        # une porte qui se déclenche pour rien s'apprend aussi vite qu'une porte qui rougit à tort.
        files: ^(CLAUDE\.md|docs/adr/.*\.md|docs/dette\.md|stories/.*\.md|epics/README\.md|journal-d-avancement/SUIVI-US\.md|backend/(domain|application|infrastructure|api|bootstrap|atlas)/.*\.py|frontend/src/features/.*\.tsx?|atlas/donnees/.*)$

      - id: eslint
        name: eslint — frontend
        entry: bash -c 'cd frontend && npx --no-install eslint .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false

      - id: prettier
        name: prettier (check) — frontend
        entry: bash -c 'cd frontend && npx --no-install prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
